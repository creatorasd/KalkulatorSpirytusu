
name: Kompilacja kalkulatora

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Kompilacja projektu
        run: dotnet build KalkulatorSpirytusu.csproj --configuration Release

      - name: Publikacja aplikacji Windows
        run: dotnet publish KalkulatorSpirytusu.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish

      - name: Zapisanie programu EXE
        uses: actions/upload-artifact@v4
        with:
          name: KalkulatorSpirytusu-Windows
          path: ./publish/
